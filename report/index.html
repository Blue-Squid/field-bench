    { h: "mJ / frame", v: (r) => r.mj, f: (v) => r1(v, 0) }, { h: "Accuracy", v: (r) => r.accuracy, f: (v) => fmtPct(v, 1) },
    { h: "GPU MHz", v: (r) => r.gpu_mhz, f: (v) => r1(v, 0) }, { h: "Over-current alarms", v: (r) => r.throttle },
    { h: "Run", t: 1, v: (r) => r.label }, { h: "Time", t: 1, v: (r) => r.timestamp.replace("T", " ").slice(0, 16) },
  ], A.pipelines);
  const n = A.models.length + A.pipelines.length;
  const thr = A.pipelines.filter((r) => r.throttle > 0), tjMax = Math.max(...[...A.models, ...A.pipelines].map((r) => r.tj_max || 0));

  return H("section", { class: "appendix", id: "appendix", "aria-labelledby": "appendix-h" },
    H("h2", { id: "appendix-h" }, "Appendix"),
    H("details", {},
      H("summary", {}, "All measurements", H("span", { class: "cnt" }, `${n} configurations · click a column to sort`)),
      H("div", { class: "inner" },
        H("p", { class: "after" }, "One row per configuration; when a configuration was measured in several runs, the most recent row is shown. Chapters above compare rows from named sessions instead (listed under each chart), so a few chapter numbers come from an earlier run of the same configuration. Accuracy: barcodes decoded, or OCR lines read exactly."),
        H("div", { class: "table-wrap" }, mt), H("div", { class: "table-wrap" }, pt))),
    H("details", {},
      H("summary", {}, "How to read these numbers"),
      H("div", { class: "inner" }, H("ul", { class: "caveats" },
        H("li", { html: "<b>GPU vs NPU.</b> Phase 1 compares Jetson GPU time with the QCS6490’s published NPU time for the same network. The handheld’s NPU is a dedicated, far lower-power unit." }),
        H("li", { html: "<b>Board power, not SoC power.</b> Energy is whole-board input power (dev kit, about 5–6 W idle) over the timed loop. A handheld SoC idles far lower, so absolute energy favors the handheld; the comparisons here are between Jetson configurations." }),
        H("li", { html: "<b>Zebra figures are published, not measured here.</b> TC53 times come from Zebra’s AI Data Capture SDK documentation for the same job at the same detector input size; the models differ." }),
        H("li", { html: "<b>Default clocks move between sessions.</b> With DVFS active the same configuration varies 10–25% across sessions; comparisons are made within one session." }),
        thr.length ? H("li", { html: `<b>Over-current alarms.</b> ${thr.length} of ${A.pipelines.length} pipeline configurations logged the SoC’s over-current alarm (<code>throttle_events</code>, which can briefly throttle clocks) during the timed loop, mostly above about 16 W board power (column in the table); the highest junction temperature in any row was ${r1(tjMax, 0)} °C.` }) : null,
        H("li", { html: "<b>Accuracy column.</b> Barcodes decoded, OCR lines read exactly, or product top-1; BarBeR rows are real photos, every other row is a synthetic test set." }),
        H("li", { html: "<b>Synthetic test sets.</b> Barcode and OCR frames are generated with exact ground truth; accuracy on real photos has not been measured yet." }),
        H("li", { html: `Full definitions and caveats: <a href="../docs/methodology.md">methodology</a>, <a href="../docs/results-phase1.md">Phase 1 results</a>, <a href="../docs/results-phase2.md">Phase 2 results</a>.` }),
      ))));
}

/* ============================================================== page */
function kpiTile({ value, unit, label, caption, hero }) {
  return H("div", { class: `kpi${hero ? " hero" : ""}` }, H("div", { class: "bar", "aria-hidden": "true" }),
    H("div", { class: "v" }, value, unit ? H("small", {}, unit) : null), H("div", { class: "l" }, label), H("div", { class: "c" }, caption));
}
function themeControl() {
  const get = () => document.documentElement.getAttribute("data-theme") || "auto";
  const set = (t) => {
    if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("fieldbench-theme", t); } catch { /* storage unavailable */ }
    box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
    drawAll(true);
  };
  const box = H("div", { class: "theme", role: "group", "aria-label": "Color theme" },
    ["auto", "light", "dark"].map((t) => H("button", { type: "button", "data-t": t, "aria-pressed": String(get() === t), onclick: () => set(t) }, t[0].toUpperCase() + t.slice(1))));
  return box;
}

function main() {
  try { const t = (location.hash.match(/theme=(light|dark)/) || [])[1] || localStorage.getItem("fieldbench-theme"); if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t); } catch { /* storage unavailable */ }
  FAMILY = getComputedStyle(document.body).fontFamily;
  const app = document.getElementById("app");
  const built = [];
  for (const c of CHAPTERS) {
    if (!DATA[c.key]) continue;
    let ch = null;
    try { ch = c.render(DATA[c.key]); } catch (e) { console.error(`chapter ${c.key}:`, e); }  // one bad payload never blanks the page

    if (ch) built.push(ch);
  }
  const K = Object.fromEntries(built.map((c) => [c.id, c.kpi]));

  // verdict + KPI strip, computed from the chapters
  const board = DATA.board_short || "The Jetson";
  const gp = K.gpuprep, md = K.models, ov = K.overlap;
  const h1 = gp
    ? `A ${board} keeps pace with a Zebra TC53 handheld on barcode and OCR, and runs up to ${fmtX(gp.ratio, 1)} faster once the CPU stages move to the GPU`
    : `${board}: handheld-class computer vision, measured`;
  const tiles = [];
  if (gp) tiles.push(kpiTile({ hero: true, value: fmtX(gp.ratio), label: `${pipeName(gp.best.pipeline)} at ${gp.best.size} px vs the Zebra TC53`, caption: `${fmtMs(gp.best.after.p50)} vs ${fmtRef(gp.best.after.ref.ms)} per frame, with NVJPG decode and GPU preprocessing` }));

  if (gp && gp.bc640) tiles.push(kpiTile({ value: r1(gp.bc640.after.p50, 1), unit: "ms", label: "Barcode frame at 640 px", caption: `p50 per 4 MP frame vs the TC53’s ${r1(gp.bc640.after.ref.ms, 0)} ms (${fmtX(gp.bc640.after.ref.ms / gp.bc640.after.p50)}); ${fmtPct(gp.bc640.after.accuracy, 1)} of barcodes read` }));
  if (md) tiles.push(kpiTile({ value: fmtX(md.ratio), label: `${nb(md.y.name)} ${md.r.precision.toUpperCase()} vs the QCS6490 NPU`, caption: `${fmtMs(md.r.p50)} GPU time vs ${fmtMs(md.y.ref.ms)} published, at MAXN SUPER` }));
  const e32 = md && md.y.p.fp32, e8 = md && md.y.p.int8;
  if (e32 && e8) tiles.push(kpiTile({ value: fmtX(e32.mj / e8.mj, 1), label: "Less energy per inference, FP32 → INT8", caption: `${md.y.name}: ${r1(e32.mj, 0)} → ${r1(e8.mj, 0)} mJ per inference, whole board. The power mode moves it far less.` }));


  else if (ov) tiles.push(kpiTile({ value: fmtX(ov.mult, 1), label: "Throughput from overlapping frames", caption: `${pipeName(ov.best.pipeline)} ${ov.best.size} px` }));

  const PH = { 1: "Phase 1 · Bare networks against the handheld NPU", 2: "Phase 2 · Handheld pipelines on 4 MP frames", 3: "Phase 3 · Several models per frame, product recognition, sustained load" };
  built.forEach((c) => { c.phase = c.phase || (c.id === "models" || c.id === "power" ? 1 : 2); });
  const phases = [...new Set(built.map((c) => c.phase))];
  const tPhase = phases.map((p) => `Phase ${p}`).join(" · ");
  add(app, [
    H("header", {},
      H("div", { class: "top" }, H("div", { class: "kicker" }, `fieldbench · ${tPhase}`), themeControl()),
      H("h1", {}, h1),
      H("p", { class: "standfirst" }, `Real handheld workloads (barcode reading and OCR on 4 MP camera frames, plus the bare networks) timed stage by stage on the Jetson, with whole-board energy and exact ground truth, next to the published figures of the Qualcomm QCS6490 NPU and the Zebra TC53 handheld built on it.`),
      H("div", { class: "meta" },
        H("span", {}, H("b", {}, DATA.board_short || DATA.board || "Jetson")),
        DATA.jetpack ? H("span", {}, `JetPack ${DATA.jetpack}`) : null,
        DATA.l4t ? H("span", {}, `L4T R${DATA.l4t}`) : null,
        H("span", {}, `${DATA.appendix.models.length + DATA.appendix.pipelines.length} configurations`),
        H("span", {}, `Generated ${DATA.generated}`))),
    tiles.length ? H("section", { class: "kpis", "aria-label": "Headline numbers" }, tiles) : null,
    H("nav", { class: "story", "aria-label": "The story in short" }, H("h2", {}, "The story in short"),
      H("ol", {}, built.map((c, i) => [i === 0 || built[i - 1].phase !== c.phase ? H("li", { class: "ph", "aria-hidden": "true" }, PH[c.phase].split(" · ")[0]) : null,
        H("li", {}, H("a", { href: `#${c.id}` }, c.title))]))),
    H("div", { class: "key", "aria-label": "Color key used in every chart" },
      H("span", {}, H("i", { class: "sw accent" }), "Jetson: the result each chart is about"),
      H("span", {}, H("i", { class: "sw context" }), "Other Jetson configurations"),
      H("span", {}, H("i", { class: "sw ref" }), "Handheld’s published figure"),
      H("span", {}, H("i", { class: "sw cost" }), "The cost: CPU-bound stages, lost accuracy, DVFS tax")),
  ]);
  built.forEach((c, i) => {
    if (i === 0 || built[i - 1].phase !== c.phase) {
      const [a, b] = PH[c.phase].split(" · ");
      add(app, H("div", { class: "phase-div", role: "separator" }, H("span", {}, a), H("b", {}, b)));
    }
    add(app, H("section", { class: "chapter", id: c.id, "aria-labelledby": `${c.id}-h` },
      H("div", { class: "num" }, String(i + 1).padStart(2, "0")),
      H("h2", { id: `${c.id}-h` }, c.title),
      H("p", { class: "lede", html: c.lede }),
      c.figs.length ? H("div", { class: `figs ${c.layout}` }, c.figs) : null,
      c.after ? H("p", { class: "after" }, c.after) : null,
      c.sources ? H("p", { class: "source" }, sourcesLine(c.sources)) : null));
  });
  add(app, renderAppendix());
  add(app, H("footer", {},
    H("span", {}, H("b", {}, "fieldbench"), ", Siddhartha Boppana"),
    H("span", {}, `Generated ${DATA.generated}`),
    H("span", {}, [DATA.board, DATA.jetpack ? `JetPack ${DATA.jetpack}` : null, DATA.l4t ? `L4T R${DATA.l4t}` : null].filter(Boolean).join(" · "))));

  if (location.hash === "#appendix") { const d = document.querySelector("#appendix details"); if (d) { d.open = true; d.scrollIntoView(); } }
  drawAll(true);
  const ro = new ResizeObserver(() => drawAll(false));

  FIGS.forEach((f) => ro.observe(f.plot));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawAll(true));
  addEventListener("beforeprint", () => document.querySelectorAll("details").forEach((d) => { d.dataset.wasOpen = d.open; d.open = true; }));
}
main();
</script>
</body>
</html>
